name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    uses: abijith-suresh/workflows/.github/workflows/bun-quality.yml@9c9e55ab629eafe5b5edbae9857b1d66fb384f8c # v0.8.1
    permissions:
      contents: read

  dependency-review:
    name: dependency-review
    uses: abijith-suresh/workflows/.github/workflows/dependency-review.yml@9c9e55ab629eafe5b5edbae9857b1d66fb384f8c # v0.8.1
    permissions:
      contents: read
